---
- name: Test Cisco NX-OS Connectivity
  hosts: nxos
  gather_facts: false

  tasks:
    - name: Test NX-OS SSH connection
      cisco.nxos.nxos_command:
        commands:
          - show version
      register: nxos_result

    - name: Display NX-OS connectivity result
      ansible.builtin.debug:
        msg:
          - "Device: {{ inventory_hostname }}"
          - "IP/FQDN: {{ ansible_host }}"
          - "Status: SUCCESS"
          - "SSH connection established"

    - name: Display NX-OS version
      ansible.builtin.debug:
        var: nxos_result.stdout_lines
