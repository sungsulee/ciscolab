---
all:
  children:
    nxos:
      hosts:
        nx1:
          ansible_host: nx1.home.arpa
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: "{{ lookup('env', 'ANSIBLE_USERNAME') }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_KEY') }}"
        ansible_host_key_checking: False


    ios:
      hosts:
        r1:
          ansible_host: r1.home.arpa
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
        ansible_user: "{{ lookup('env', 'ANSIBLE_USERNAME') }}"
        ansible_ssh_private_key_file: "{{ lookup('env', 'ANSIBLE_SSH_KEY') }}"
        ansible_host_key_checking: False
        ansible_network_cli_ssh_type: libssh

        # Allow legacy RSA host-key algorithm
        ansible_libssh_hostkeys: ssh-rsa

 
