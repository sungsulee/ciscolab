---
all:
  children:
    nxos:
      hosts:
        nx1:
          ansible_host: nx1.home.arpa
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
        ansible_user: "{{ lookup('env', 'ANSIBLE_USERNAME') }}"

    ios:
      hosts:
        r1:
          ansible_host: r1.home.arpa
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.iso
        ansible_user: "{{ lookup('env', 'ANSIBLE_USERNAME') }}"
 
